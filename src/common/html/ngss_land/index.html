	<script>
		document.querySelectorAll("figcaption").forEach((caption) => {
			if (caption.scrollWidth <= caption.clientWidth) return;
			
			let direction = 1;
			let pauseUntil = 0;
			
			const speed = 0.5;      // px per frame
			const pauseTime = 1000; // ms
			
			function step(time) {
				if (time >= pauseUntil) {
					const maxScroll = caption.scrollWidth - caption.clientWidth;
					
					caption.scrollLeft += direction * speed;
					
					if (caption.scrollLeft >= maxScroll) {
						caption.scrollLeft = maxScroll;
						direction = -1;
						pauseUntil = time + pauseTime;
					}
					
					if (caption.scrollLeft <= 0) {
						caption.scrollLeft = 0;
						direction = 1;
						pauseUntil = time + pauseTime;
					}
				}
				
				requestAnimationFrame(step);
			}
			
			requestAnimationFrame(step);
		});
	</script>
